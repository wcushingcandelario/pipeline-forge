# PipelineForge reusable workflow candidate
name: Reusable maven CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - run: docker build -t migration-validation:${{ github.sha }} .
